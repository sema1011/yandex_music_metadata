name = "Yandex Music"
version = "1.0.0"
description = "Получает метаданные треков (жанр, explicit, тексты) и обложки альбомов из Яндекс Музыки."
api = ["3.0"]

authors = ["sema1011"]
license = "GPL-3.0-or-later"
license_url = "https://www.gnu.org/licenses/gpl-3.0.html"

long_description = """
Плагин для MusicBrainz Picard, дополняющий метаданные из открытого API Яндекс Музыки.

Возможности:
  - Поиск треков по ISRC или по названию (артист + заголовок)
  - Загрузка жанра из каталога Яндекс Музыки
  - Простановка метки explicit (18+)
  - Загрузка текстов песен (требует OAuth-токен)
  - Загрузка обложек альбомов в высоком разрешении (1000x1000)

Поиск по ISRC включён по умолчанию — это даёт наиболее точные совпадения.
Если ISRC отсутствует, плагин ищет по артисту и названию трека с нормализацией ё→е.
"""

categories = ["metadata", "coverart"]
min_python_version = "3.9"
source_locale = "ru"
